[project]
name = "agent-template"
version = "0.1.0"
description = "Minimal-but-complete local agent template: LLM calls, function calling, skills, MCP and RAG."
readme = "README.md"
authors = [
    { name = "ZhaoShiGuang", email = "123456789@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "tzdata>=2026.4",
]

[project.scripts]
agent-template = "agent_template:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
